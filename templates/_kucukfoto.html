{% macro kucuk(e) %}
{% if e.goruntu %}
<button type="button" class="kfoto" data-idler="{{ e.goruntu_idler }}"
        data-no="{{ e.cycle_sira_no }}" aria-label="Oosit {{ e.cycle_sira_no }} büyüt">
  <img src="/dosya/{{ e.goruntu }}" alt="Oosit {{ e.cycle_sira_no }}">
  {% if e.kare > 1 %}<span class="kare">{{ e.kare }}</span>{% endif %}
</button>
{% else %}
<span class="kfoto yok">—</span>
{% endif %}
{% endmacro %}

{% macro baglama() %}
<script>
document.querySelectorAll('.kfoto[data-idler]').forEach(function (b) {
  b.addEventListener('click', function () {
    var idler = (b.dataset.idler || '').split(',').filter(Boolean);
    if (idler.length && window.buyutecAc) window.buyutecAc(idler, b.dataset.no, 0);
  });
});
</script>
{% endmacro %}
