{% macro serit(kareler, sp, c, asama, geri) %}
{% if kareler %}
<div class="karestrip">
  {% for g in kareler %}
  <div class="fkare">
    <button type="button" class="kfoto stripkare"
            data-idler="{{ kareler|map(attribute='id')|join(',') }}"
            data-baslangic="{{ loop.index0 }}" data-no="{{ sp.cycle_sira_no }}"
            aria-label="{{ metin('kare_n').format(n=loop.index) }}">
      <img src="/dosya/{{ g.id }}" alt="{{ metin('kare_n').format(n=loop.index) }}">
    </button>
    <a class="fsil" href="/goruntu/{{ g.id }}/sil?geri={{ geri|urlencode }}"
       aria-label="{{ metin('bu_kareyi_sil') }}" title="{{ metin('bu_kareyi_sil') }}">&times;</a>
  </div>
  {% endfor %}
</div>
<div class="karebilgi">{{ kareler|length }} kare · bu aşamada</div>
{% endif %}
{% endmacro %}
