<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- desen.svg'nin 180 derece cevrilmis hali (v6.75), sol alt kose icin.
       Ayni motif, yogun kume SOL ALT'ta kalsin diye koordinatlar aynadan
       yansitilmis (x'=420-x, y'=420-y). Iki ayri dosya gerekti cunku CSS
       background katmanlarinda tek tek transform verilemiyor. -->
  <defs>
    <radialGradient id="g2" cx="20%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#e0356f" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#e0356f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e0356f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="420" height="420" fill="url(#g2)"/>

  <circle cx="60" cy="360" r="78" fill="none" stroke="#e0356f" stroke-width="3" opacity="0.22"/>

  <g opacity="0.24">
    <circle cx="90" cy="390" r="17" fill="#e0356f"/>
    <circle cx="54" cy="390" r="17" fill="#e0356f"/>
    <circle cx="90" cy="354" r="17" fill="#e0356f"/>
    <circle cx="54" cy="354" r="17" fill="#e0356f"/>
  </g>

  <g opacity="0.18">
    <circle cx="150" cy="290" r="15" fill="#e0356f"/>
    <circle cx="120" cy="290" r="15" fill="#e0356f"/>
  </g>

  <circle cx="190" cy="220" r="7" fill="#e0356f" opacity="0.16"/>
  <circle cx="240" cy="270" r="5" fill="#e0356f" opacity="0.14"/>
  <circle cx="40" cy="240" r="6" fill="#4d7fb0" opacity="0.14"/>
  <circle cx="300" cy="330" r="4" fill="#4d7fb0" opacity="0.12"/>
</svg>
