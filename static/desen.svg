<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Arka plan kosesi motifi (v6.75, kullanicinin istegi): tup bebek/
       embriyoloji temali. Sayfanin iki kosesine (sag ust, sol alt) yerlesir,
       style.css'te iki katman olarak. Kartlarin ustune degil bosluklara
       duser cunku kartlar opak. Motif amblemle ayni aile: dort hucreli
       embriyo, zona pellucida halkasi, bolunen ve tek hucreler. Kosede
       yogun, merkeze dogru soluyor. -->
  <defs>
    <radialGradient id="g1" cx="80%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#e0356f" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#e0356f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e0356f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="420" height="420" fill="url(#g1)"/>

  <!-- zona pellucida halkasi -->
  <circle cx="360" cy="60" r="78" fill="none" stroke="#e0356f" stroke-width="3" opacity="0.22"/>

  <!-- dort hucreli embriyo, amblemle ayni motif -->
  <g opacity="0.24">
    <circle cx="330" cy="30" r="17" fill="#e0356f"/>
    <circle cx="366" cy="30" r="17" fill="#e0356f"/>
    <circle cx="330" cy="66" r="17" fill="#e0356f"/>
    <circle cx="366" cy="66" r="17" fill="#e0356f"/>
  </g>

  <!-- ikiye bolunen hucre -->
  <g opacity="0.18">
    <circle cx="270" cy="130" r="15" fill="#e0356f"/>
    <circle cx="300" cy="130" r="15" fill="#e0356f"/>
  </g>

  <!-- dagilmis tek hucreler -->
  <circle cx="230" cy="200" r="7" fill="#e0356f" opacity="0.16"/>
  <circle cx="180" cy="150" r="5" fill="#e0356f" opacity="0.14"/>
  <circle cx="380" cy="180" r="6" fill="#4d7fb0" opacity="0.14"/>
  <circle cx="120" cy="90" r="4" fill="#4d7fb0" opacity="0.12"/>
</svg>
